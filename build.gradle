plugins {
    id 'java'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'
            // задаем язык
java {
    sourceCompatibility = 11
}
        // зададим кодировку
compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}
                // зависимость
dependencies {
    testImplementation 'org.testng:testng:7.1.0'
}

test {
    useTestNG()
}